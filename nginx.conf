# /etc/nginx/sites-available/mail.hax429.me
#
# Replaces the existing Stalwart proxy. Install with:
#   sudo cp /home/ubuntu/services/mail/nginx.conf /etc/nginx/sites-available/mail.hax429.me
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name mail.hax429.me;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name mail.hax429.me;

    ssl_certificate /etc/letsencrypt/live/hax429.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hax429.me/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Inbound emails can be large (attachments)
    client_max_body_size 25M;

    # Resend's webhook signature uses the raw body — don't let nginx rewrite it.
    location /api/webhook {
        proxy_pass http://localhost:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
    }

    location / {
        proxy_pass http://localhost:3020;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
